# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.95
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "Unicode-3.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace-internal path dependencies carry no version; nothing is published.
allow-wildcard-paths = true
highlight = "all"
skip = [
  # Build-time only: zeroize_derive is still on syn 2, PyO3's macros moved
  # to syn 3. Neither ships in any binary; drop once zeroize_derive moves.
  { crate = "syn@2", reason = "proc-macro dependency mid-migration (zeroize_derive)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

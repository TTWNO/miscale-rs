# Conventional Commits: https://www.conventionalcommits.org/
style = "conventional"
allowed_types = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "style",
  "test",
]
subject_length = 72
line_length = 72
subject_capitalized = false
merge_commit = false

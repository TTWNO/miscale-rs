[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "miscale-native"
description = "Python bindings for the miscale sans-io weigh session (Xiaomi Smart Scale S200)"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
dynamic = ["version"]
classifiers = ["Private :: Do Not Upload"]

[tool.maturin]
module-name = "miscale_native"

# taplo does not read .gitignore; keep it out of build and virtualenv trees.
exclude = [".venv/**", "dist/**", "target/**"]

[formatting]
align_entries = false
array_auto_collapse = true
array_auto_expand = true
column_width = 100
indent_string = "  "

[[rule]]
include = ["**/Cargo.toml"]
keys = ["dependencies", "dev-dependencies", "build-dependencies", "workspace.dependencies"]
[rule.formatting]
reorder_keys = true
